<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LearnHub — Home</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <div id="app">
    <header class="nav">
      <div class="nav-left">
        <a href="/" class="logo">LearnHub</a>
        <nav class="links">
          <a href="index.html">Home</a>
          <a href="pages/courses.html">Courses</a>
          <a id="nav-my-learning" href="pages/my-learning.html">My Learning</a>
        </nav>
      </div>
      <div class="nav-right" id="nav-auth-area">
        <!-- populated by js/app.js -->
      </div>
    </header>

    <main class="container hero">
      <div class="hero-content">
        <h1>Learn Skills. Build Projects. Grow Your Career.</h1>
        <p class="lead">Curated developer courses. Project-based lessons. Real-world skills.</p>
        <div class="hero-actions">
          <a class="btn primary" href="pages/courses.html">Browse Courses</a>
          <a class="btn ghost" href="pages/register.html">Get Started</a>
        </div>
      </div>

      <div class="hero-illustration">
        <div class="card glass">
          <h3>Featured Courses</h3>
          <div id="featured-courses" class="course-grid"></div>
        </div>
      </div>
    </main>

    <section class="container cards" id="home-stats">
      <div class="stat">
        <div class="stat-value" id="stat-courses">—</div>
        <div class="stat-label">Courses</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-students">—</div>
        <div class="stat-label">Students</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-instructors">—</div>
        <div class="stat-label">Instructors</div>
      </div>
    </section>

    <footer class="footer container">
      <div>© LearnHub</div>
      <div><a href="pages/profile.html">Profile</a> • <a href="pages/admin.html">Admin</a></div>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
