<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — LearnHub</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <a href="../index.html" class="logo">LearnHub</a>
      <nav class="links">
        <a href="../index.html">Home</a>
        <a href="courses.html">Courses</a>
      </nav>
    </div>
    <div class="nav-right" id="nav-auth-area"></div>
  </header>
  <main class="container auth-page">
    <div class="auth-card glass">
      <h2>Sign in to LearnHub</h2>
      <form id="login-form">
        <label>Email</label>
        <input name="email" type="email" required />
        <label>Password</label>
        <div class="password-input">
          <input name="password" id="password" type="password" required />
          <button type="button" id="toggle-password" class="icon-btn">Show</button>
        </div>
        <div id="login-error" class="error" role="alert" style="display:none"></div>
        <div class="actions">
          <button class="btn primary" type="submit" id="login-submit">Sign In</button>
          <a class="btn ghost" href="../index.html">Back to Home</a>
        </div>
      </form>
      <p class="muted">New to LearnHub? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
