<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Sign In – LearnHub</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--dark);
        padding: 24px;
      }
      .auth-wrap {
        width: 100%;
        max-width: 460px;
      }
      .auth-logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px;
        box-shadow: var(--shadow-lg);
      }
      .auth-tabs {
        display: flex;
        background: var(--dark-3);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 28px;
      }
      .auth-tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--text-muted);
        transition: var(--transition);
        border: none;
        background: none;
      }
      .auth-tab.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .auth-form.hidden {
        display: none;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .submit-btn {
        padding: 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        border: none;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 4px;
      }
      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(108, 71, 255, 0.35);
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      .auth-divider {
        text-align: center;
        color: var(--text-dim);
        font-size: 0.82rem;
        position: relative;
      }
      .auth-divider::before,
      .auth-divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 42%;
        height: 1px;
        background: var(--border);
      }
      .auth-divider::before {
        left: 0;
      }
      .auth-divider::after {
        right: 0;
      }
      .admin-hint {
        background: rgba(108, 71, 255, 0.08);
        border: 1px solid rgba(108, 71, 255, 0.2);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.82rem;
        color: var(--text-muted);
        margin-top: 12px;
      }
      .admin-hint strong {
        color: var(--primary-lt);
      }
      .back-home {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-bottom: 20px;
        transition: var(--transition);
      }
      .back-home:hover {
        color: var(--primary-lt);
      }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <a href="../index.html" class="back-home">← Back to Home</a>
      <div class="auth-logo">
        <a href="../index.html" class="logo" style="font-size: 1.8rem"
          >Learn<span>Hub</span></a
        >
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button
            class="auth-tab active"
            id="tabLogin"
            onclick="switchTab('login')"
          >
            Sign In
          </button>
          <button
            class="auth-tab"
            id="tabRegister"
            onclick="switchTab('register')"
          >
            Create Account
          </button>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              class="form-input"
              id="loginEmail"
              placeholder="name@example.com"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-input"
              id="loginPassword"
              placeholder="••••••••"
              required
            />
          </div>
          <button type="submit" class="submit-btn" id="loginBtn">
            Sign In →
          </button>
          <div
            id="loginError"
            class="text-muted"
            style="
              font-size: 0.85rem;
              text-align: center;
              display: none;
              color: #e74c3c;
            "
          ></div>
          <div class="admin-hint">
            <!-- <strong>Admin login:</strong> admin@learnhub.com / Admin@123 -->
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form class="auth-form hidden" id="registerForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input
                type="text"
                class="form-input"
                id="regFirst"
                placeholder="Arjun"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <input
                type="text"
                class="form-input"
                id="regLast"
                placeholder="Sharma"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              class="form-input"
              id="regEmail"
              placeholder="name@example.com"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input
              type="tel"
              class="form-input"
              id="regPhone"
              placeholder="+91 XXXXX XXXXX"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Password (min 6 characters)</label>
            <input
              type="password"
              class="form-input"
              id="regPassword"
              placeholder="Create a strong password"
              required
              minlength="6"
            />
          </div>
          <button type="submit" class="submit-btn" id="regBtn">
            Create Account →
          </button>
          <div
            id="regError"
            style="
              font-size: 0.85rem;
              text-align: center;
              display: none;
              color: #e74c3c;
            "
          ></div>
        </form>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
      // Redirect if already logged in
      if (Auth.isLoggedIn()) window.location.href = "../index.html";

      function switchTab(tab) {
        document
          .getElementById("tabLogin")
          .classList.toggle("active", tab === "login");
        document
          .getElementById("tabRegister")
          .classList.toggle("active", tab === "register");
        document
          .getElementById("loginForm")
          .classList.toggle("hidden", tab !== "login");
        document
          .getElementById("registerForm")
          .classList.toggle("hidden", tab !== "register");
      }

      // LOGIN
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("loginBtn");
          const err = document.getElementById("loginError");
          btn.textContent = "Signing in…";
          btn.disabled = true;
          err.style.display = "none";
          try {
            const res = await api.post("/auth/login", {
              email: document.getElementById("loginEmail").value,
              password: document.getElementById("loginPassword").value,
            });
            Auth.save(res.token, {
              fullName: res.fullName,
              email: document.getElementById("loginEmail").value,
              role: res.role,
              id: res.userId,
            });
            // Redirect: admins go to admin panel
            window.location.href =
              res.role === "ADMIN" ? "admin.html" : "../index.html";
          } catch (ex) {
            err.textContent = ex.message || "Invalid credentials";
            err.style.display = "block";
            btn.textContent = "Sign In →";
            btn.disabled = false;
          }
        });

      // REGISTER
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("regBtn");
          const err = document.getElementById("regError");
          btn.textContent = "Creating account…";
          btn.disabled = true;
          err.style.display = "none";
          const email = document.getElementById("regEmail").value;
          try {
            const res = await api.post("/auth/register", {
              fullName:
                document.getElementById("regFirst").value +
                " " +
                document.getElementById("regLast").value,
              email,
              password: document.getElementById("regPassword").value,
              phone: document.getElementById("regPhone").value,
            });
            Auth.save(res.token, {
              fullName: res.fullName,
              email,
              role: res.role,
              id: res.userId,
            });
            window.location.href = "../index.html";
          } catch (ex) {
            err.textContent = ex.message || "Registration failed";
            err.style.display = "block";
            btn.textContent = "Create Account →";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
