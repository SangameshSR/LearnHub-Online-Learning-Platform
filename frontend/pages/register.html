<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — LearnHub</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <a href="../index.html" class="logo">LearnHub</a>
    </div>
    <div class="nav-right" id="nav-auth-area"></div>
  </header>

  <main class="container auth-page">
    <div class="auth-card glass">
      <h2>Create your account</h2>
      <form id="register-form">
        <label>Full name</label>
        <input name="fullName" type="text" required />
        <label>Email</label>
        <input name="email" type="email" required />
        <label>Password</label>
        <input name="password" type="password" required minlength="6" />
        <label>Confirm password</label>
        <input name="confirmPassword" type="password" required minlength="6" />
        <div id="register-error" class="error" role="alert" style="display:none"></div>
        <div class="actions">
          <button class="btn primary" type="submit" id="register-submit">Create account</button>
          <a class="btn ghost" href="login.html">Have an account? Sign in</a>
        </div>
      </form>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
