<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Learning | LearnHub</title>

    <link rel="stylesheet" href="../css/global.css" />

    <style>
      body {
        background: #0f0f0f;
        color: white;
        font-family: Arial, sans-serif;
      }

      .container {
        max-width: 1200px;
        margin: auto;
        padding: 40px 20px;
      }

      .title {
        font-size: 40px;
        margin-bottom: 40px;
        font-weight: bold;
      }

      .courses-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 25px;
      }

      .card {
        background: #181818;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid #333;
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .top {
        padding: 25px;
      }

      .emoji {
        font-size: 50px;
      }

      .course-title {
        font-size: 22px;
        margin-top: 15px;
        font-weight: bold;
      }

      .progress-bar {
        width: 100%;
        height: 12px;
        background: #333;
        border-radius: 20px;
        overflow: hidden;
        margin-top: 20px;
      }

      .fill {
        height: 100%;
        background: #3498db;
      }

      .progress-text {
        margin-top: 10px;
        color: #bbb;
        font-size: 14px;
      }

      .btn {
        width: 100%;
        border: none;
        padding: 14px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 10px;
        margin-top: 20px;
        color: white;
      }

      .learn-btn {
        background: #3498db;
      }

      .cert-btn {
        background: #af9342;
      }

      .navbar {
        background: #111;
        padding: 18px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
        color: white;
        text-decoration: none;
      }

      .logo span {
        color: #3498db;
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>

  <body>
    <div class="navbar">
      <a href="../index.html" class="logo"> Learn<span>Hub</span> </a>

      <button
        onclick="logout()"
        class="btn"
        style="width: 150px; background: #e74c3c; margin: 0"
      >
        Logout
      </button>
    </div>

    <div class="container">
      <h1 class="title">My Learning</h1>

      <div id="coursesGrid" class="courses-grid"></div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/data.js"></script>

    <script>
      const grid = document.getElementById("coursesGrid");

      async function loadCourses() {
        try {
          const enrollments = await api.get("/enrollments/my");

          if (!enrollments || enrollments.length === 0) {
            grid.innerHTML = "<h2>No enrolled courses found.</h2>";

            return;
          }

          grid.innerHTML = "";

          enrollments.forEach((e) => {
            const course = COURSES_DATA.find((c) => c.id == e.courseId);

            if (!course) return;

            let progress =
              parseInt(localStorage.getItem("progress_" + course.id)) || 0;

            let pct = Math.round((progress / course.totalLessons) * 100);

            if (pct > 100) {
              pct = 100;
            }

            const card = `

            <div class="card">

              <div class="top">

                <div class="emoji">
                  ${course.emoji}
                </div>

                <div class="course-title">
                  ${course.title}
                </div>

                <div class="progress-bar">
                  <div
                    class="fill"
                    style="width:${pct}%"
                  ></div>
                </div>

                <div class="progress-text">
                  ${pct}% Completed
                </div>

                ${
                  pct >= 100
                    ? `
                  <button
                    class="btn cert-btn"
                    onclick="downloadCertificate(
                      '${course.title}'
                    )"
                  >
                    🎓 Download Certificate
                  </button>
                  `
                    : `
                  <button
                    class="btn learn-btn"
                    onclick="openCourse(${course.id})"
                  >
                    ▶ Continue Learning
                  </button>
                  `
                }

              </div>

            </div>

          `;

            grid.innerHTML += card;
          });
        } catch (err) {
          console.log(err);

          grid.innerHTML = "<h2>Error loading courses</h2>";
        }
      }

      function openCourse(courseId) {
        const course = COURSES_DATA.find((c) => c.id == courseId);

        if (!course) {
          alert("Course not found");

          return;
        }

        window.location.href =
          `player.html?courseId=${course.id}` +
          `&playlistId=${course.playlistId}` +
          `&videoId=${course.videoId}`;
      }

      function downloadCertificate(courseName) {
        const { jsPDF } = window.jspdf;

        const doc = new jsPDF({
          orientation: "landscape",
        });

        doc.setFillColor(15, 15, 15);

        doc.rect(0, 0, 297, 210, "F");

        doc.setDrawColor(52, 152, 219);

        doc.setLineWidth(4);

        doc.rect(10, 10, 277, 190);

        doc.setTextColor(255, 255, 255);

        doc.setFontSize(34);

        doc.text("CERTIFICATE OF COMPLETION", 148, 60, { align: "center" });

        doc.setFontSize(24);

        doc.text("Awarded To", 148, 95, { align: "center" });

        const user = JSON.parse(localStorage.getItem("lh_user"));

        doc.setTextColor(52, 152, 219);

        doc.setFontSize(30);

        doc.text(user.fullName, 148, 120, { align: "center" });

        doc.setTextColor(255, 255, 255);

        doc.setFontSize(20);

        doc.text(`For Successfully Completing ${courseName}`, 148, 150, {
          align: "center",
        });

        doc.save("certificate.pdf");
      }

      function logout() {
        localStorage.clear();

        window.location.href = "../index.html";
      }

      loadCourses();
    </script>
  </body>
</html>
