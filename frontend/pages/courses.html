<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Courses — LearnHub</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/courses.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <a href="../index.html" class="logo">LearnHub</a>
      <nav class="links">
        <a href="../index.html">Home</a>
        <a>Courses</a>
      </nav>
    </div>
    <div class="nav-right" id="nav-auth-area"></div>
  </header>

  <main class="container">
    <section class="filters glass">
      <input id="search-input" placeholder="Search courses..." />
      <select id="filter-category"><option value="">All categories</option></select>
      <select id="filter-level"><option value="">All levels</option><option value="Beginner">Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select>
      <select id="sort-by"><option value="relevance">Sort: Relevance</option><option value="new">Newest</option><option value="popular">Most popular</option></select>
    </section>

    <section id="courses-list" class="course-grid"></section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/courses.js"></script>
</body>
</html>
