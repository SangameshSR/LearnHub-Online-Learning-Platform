<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Certificate — LearnHub</title>
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    /* simple print-friendly certificate */
    .certificate { max-width:900px; margin:40px auto; padding:40px; background:#fff; color:#111; border-radius:8px; }
    .certificate h1{ font-size:36px; margin-bottom:10px; color:#0aa; }
    .certificate .meta{ margin-top:24px; font-size:18px; }
    @media print { body { background: none; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="certificate" id="certificate">
      <h1>Certificate of Completion</h1>
      <p>This certifies that</p>
      <h2 id="cert-fullname">Student Name</h2>
      <p>has successfully completed</p>
      <h3 id="cert-course">Course Name</h3>
      <div class="meta"><span id="cert-date"></span></div>
      <div style="margin-top:20px"><button onclick="window.print()" class="btn primary">Download / Print</button></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/certificate.js"></script>
</body>
</html>
