<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player — LearnHub</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/player.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <a href="../index.html" class="logo">LearnHub</a>
      <nav class="links"><a href="../index.html">Home</a><a href="courses.html">Courses</a></nav>
    </div>
    <div class="nav-right" id="nav-auth-area"></div>
  </header>

  
  <main class="container player-layout">
    <section class="video-pane glass">
      <div id="player"></div>
      <div id="lesson-info" class="lesson-info"></div>
      <div class="player-controls">
        <button id="prev-lesson" class="btn">Previous</button>
        <button id="next-lesson" class="btn">Next</button>
        <button id="finish-course" class="btn primary">Finish & Exit</button>
      </div>
    </section>
    <aside class="playlist-pane glass">
      <h3 id="playlist-title">Lessons</h3>
      <ul id="playlist" class="playlist"></ul>
      <div id="progress-summary" class="progress-summary"></div>
    </aside>
  </main>

  
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/player.js"></script>
</body>
</html>
